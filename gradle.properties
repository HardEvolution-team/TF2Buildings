mod_description = Port of pitman-87's TF2 Sentry and TF2 Dispenser (1.7.10) to 1.12.2 in one jar: sentry guns (3 levels, rockets), wrenches, sentry monitor and the healing/feeding/repairing dispenser. Textures and sounds are loaded from your own copies of the original 1.7.10 jars placed in the archaic_originals folder. Cleanroom Loader only, requires ArchaicLib.
